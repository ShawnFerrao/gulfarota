<!--
  GULF AORTA SUMMIT — GLOBAL HEADER (Elementor "HTML" widget)
  ─────────────────────────────────────────────────────────
  Paste this whole file into an Elementor "HTML" widget inside a
  Header template (Templates → Theme Builder → Header → add HTML
  widget), then set that template's display condition to "Entire Site".

  Self-contained: fonts, tokens and styles are all scoped under
  .gas-header-root so this can't leak into / clash with the rest of
  the page, and nothing on the page can accidentally override it.

  Do NOT paste this into individual page templates — pages should be
  built without their own header/footer; this template supplies it
  site-wide, and a matching footer template supplies the footer.

  Nav links currently point at clean page-style paths (/programme,
  /faculty, etc.) — update each href in Elementor's link picker once
  the real pages exist. "Register Interest" points at the real
  registration system already in use.
-->
<div class="gas-header-root">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Newsreader:ital,wght@0,300..700;1,300..700&family=IBM+Plex+Sans:wght@400;600&family=IBM+Plex+Mono:wght@500&display=swap');

  .gas-header-root{
    --ink:#001A3F;
    --brass:#E3BE7A;
    --brass-soft:#F2DBA8;
    --brass-dim:rgba(227,190,122,.38);
    --on-ink:#F4F6F8;
    --on-ink-mist:#9FB6CE;
    --radius:2px;
    --maxw:1180px;
    --pad:clamp(1.25rem,4vw,3.25rem);
    --ease:cubic-bezier(.16,.8,.24,1);
    display:block;
    font-family:"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  }
  .gas-header-root,.gas-header-root *,.gas-header-root *::before,.gas-header-root *::after{box-sizing:border-box;}
  .gas-header-root ul{margin:0;padding:0;list-style:none;}
  .gas-header-root a{color:inherit;text-decoration:none;}
  .gas-header-root button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;margin:0;padding:0;}
  .gas-header-root :focus-visible{outline:2px solid var(--brass);outline-offset:2px;}
  .gas-header-root img{max-width:100%;display:block;}

  /* ---- sticky bar ---- */
  .gas-header-bar{
    margin:0;padding:0;line-height:1.5;
    position:sticky;top:0;z-index:9999;
    background:rgba(14,23,32,.86);
    backdrop-filter:blur(14px) saturate(140%);
    -webkit-backdrop-filter:blur(14px) saturate(140%);
    border-bottom:1px solid rgba(227,190,122,.18);
    color:var(--on-ink);
  }
  .gas-header-bar .wrap{
    max-width:var(--maxw);margin-inline:auto;padding-inline:var(--pad);
    display:flex;align-items:center;justify-content:space-between;gap:1.5rem;
    padding-block:.85rem;
  }

  .gas-header-bar .brand{display:flex;align-items:center;gap:.7rem;flex:none;}
  .gas-header-bar .brand-mark-wrap{
    position:relative;height:44px;max-height:44px;width:auto;max-width:220px;
    display:flex;align-items:center;flex:none;overflow:hidden;
  }
  .gas-header-bar .brand-logo{
    display:block;height:44px;max-height:44px;width:auto;max-width:220px;
    object-fit:contain;object-position:left center;
  }
  .gas-header-bar .brand-logo.hidden{display:none;}
  .gas-header-bar .brand-mark-fallback{
    width:44px;height:44px;border:1px solid var(--brass-dim);border-radius:4px;
    display:none;align-items:center;justify-content:center;
    font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:.68rem;letter-spacing:.03em;color:var(--brass-soft);
  }
  .gas-header-bar .brand-word{display:none;flex-direction:column;line-height:1.05;}
  .gas-header-bar .brand.logo-fail .brand-word{display:flex;}
  .gas-header-bar .brand.logo-fail .brand-mark-fallback{display:flex;}
  .gas-header-bar .brand-word b{font-family:"Newsreader",Georgia,serif;font-style:italic;font-weight:500;font-size:1.1rem;letter-spacing:.01em;}
  .gas-header-bar .brand-word span{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:.62rem;letter-spacing:.18em;color:var(--brass-soft);text-transform:uppercase;margin-top:.15rem;display:block;}

  .gas-header-bar nav.links{display:flex;align-items:center;gap:clamp(1rem,2vw,2rem);}
  .gas-header-bar nav.links a{
    font-size:.86rem;color:var(--on-ink-mist);position:relative;padding-block:.3rem;
    transition:color .25s;
  }
  .gas-header-bar nav.links a::after{
    content:"";position:absolute;left:0;bottom:0;height:1px;width:0;background:var(--brass);
    transition:width .3s var(--ease);
  }
  .gas-header-bar nav.links a:hover{color:var(--on-ink);}
  .gas-header-bar nav.links a:hover::after{width:100%;}

  .gas-header-bar .nav-right{display:flex;align-items:center;gap:1.4rem;}
  .gas-header-bar .btn-gold{
    display:inline-flex;align-items:center;
    font-family:"IBM Plex Sans";font-weight:600;font-size:.86rem;letter-spacing:.02em;
    padding:.85em 1.4em;border-radius:var(--radius);
    background:var(--brass);color:var(--ink);
    transition:transform .35s var(--ease),background .25s;
    white-space:nowrap;
  }
  .gas-header-bar .btn-gold:hover{background:var(--brass-soft);transform:translateY(-2px);}

  .gas-header-bar .burger{display:none;width:36px;height:36px;place-items:center;color:var(--on-ink);flex:none;}
  .gas-header-bar .burger span,.gas-header-bar .burger span::before,.gas-header-bar .burger span::after{
    content:"";display:block;width:20px;height:1.5px;background:currentColor;position:relative;
    transition:transform .3s var(--ease),opacity .3s;
  }
  .gas-header-bar .burger span::before{position:absolute;top:-6px;}
  .gas-header-bar .burger span::after{position:absolute;top:6px;}

  /* ---- mobile fullscreen panel ---- */
  .gas-header-mobile{
    position:fixed;inset:0;z-index:10000;background:var(--ink);color:var(--on-ink);
    overflow-y:auto;
    transform:translateY(-100%);transition:transform .5s var(--ease);
  }
  .gas-header-mobile.open{transform:translateY(0);}
  .gas-header-mobile .panel-inner{
    padding:clamp(1.5rem,6vw,2.5rem);display:flex;flex-direction:column;
    gap:clamp(1.1rem,4vh,2rem);justify-content:center;min-height:100%;
  }
  .gas-header-mobile a{font-family:"Newsreader";font-style:italic;font-size:clamp(1.4rem,7vw,2rem);color:var(--on-ink);}
  .gas-header-mobile .close{position:absolute;top:1.5rem;right:1.5rem;color:var(--on-ink);}

  .gas-header-mobile .panel-cta{
    display:inline-flex;align-items:center;margin-top:.5rem;
    font-family:"IBM Plex Sans";font-weight:600;font-size:.92rem;letter-spacing:.02em;
    padding:.85em 1.5em;border-radius:var(--radius);background:var(--brass);color:var(--ink);
  }

  @media (max-width:980px){
    .gas-header-bar nav.links{display:none;}
    .gas-header-bar .burger{display:grid;}
  }
  /* below this, "Register Interest" + burger no longer both fit the compact bar —
     drop the button here and rely on the same CTA inside the mobile panel */
  @media (max-width:600px){
    .gas-header-bar .nav-right .btn-gold{display:none;}
  }
  @media (max-width:360px){
    .gas-header-bar .wrap{padding-inline:1rem;}
    .gas-header-bar .brand-mark-wrap{max-width:150px;}
    .gas-header-bar .brand-logo{max-width:150px;}
  }

  @media (prefers-reduced-motion:reduce){
    .gas-header-root *{transition-duration:.001ms !important;}
  }
</style>

<header class="gas-header-bar">
  <div class="wrap">
    <a class="brand" href="/">
      <span class="brand-mark-wrap">
        <img class="brand-logo" src="https://assets.cdn.filesafe.space/xXmmT1dJF4Y9TpAkhBe3/media/6909ae566b7a570d9aa4a93c.png" alt="Gulf Aorta Summit" loading="lazy" data-fallback="brand">
        <span class="brand-mark-fallback">GAS</span>
      </span>
      <span class="brand-word"><b>Gulf Aorta Summit</b><span>GAS · 2026 · Dubai</span></span>
    </a>

    <nav class="links" aria-label="Primary">
      <a href="/">Home</a>
      <a href="/board-of-directors/">Board of Directors</a>
      <a href="/board-of-organizers/">Board of Organizers</a>
    </nav>

    <div class="nav-right">
      <a class="btn-gold" href="https://maarefahmgt.zohobackstage.com/GulfAortaSummit#/tickets?lang=en" target="_blank" rel="noreferrer noopener">Register Interest</a>
      <button class="burger" id="gasBurgerBtn" aria-label="Open menu" aria-expanded="false" aria-controls="gasMobilePanel">
        <span></span>
      </button>
    </div>
  </div>
</header>

<div class="gas-header-mobile" id="gasMobilePanel">
  <div class="panel-inner">
    <button class="close" id="gasCloseBtn" aria-label="Close menu">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none"><path d="M5 5L19 19M19 5L5 19" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
    </button>
    <a href="/">Home</a>
    <a href="/board-of-directors/">Board of Directors</a>
    <a href="/board-of-organizers/">Board of Organizers</a>
    <a class="panel-cta" href="https://maarefahmgt.zohobackstage.com/GulfAortaSummit#/tickets?lang=en" target="_blank" rel="noreferrer noopener">Register Interest</a>
  </div>
</div>
</div>

<script>
(function(){
  // delegated, capture-phase image-fallback handler (no inline onerror= attributes
  // — some hosts' security plugins flag inline event-handler attributes as XSS)
  document.addEventListener('error', function(e){
    var img = e.target;
    if (!img || img.tagName !== 'IMG' || !img.dataset || !img.dataset.fallback) return;
    img.classList.add('hidden');
    if (img.dataset.fallback === 'brand') {
      var brand = img.closest('.brand');
      if (brand) brand.classList.add('logo-fail');
    } else if (img.dataset.fallback === 'marquee') {
      if (img.parentElement) img.parentElement.classList.add('img-fail');
    }
  }, true);

  var burger=document.getElementById('gasBurgerBtn');
  var panel=document.getElementById('gasMobilePanel');
  var closeBtn=document.getElementById('gasCloseBtn');
  if(!burger||!panel||!closeBtn) return;
  function openPanel(){panel.classList.add('open');burger.setAttribute('aria-expanded','true');document.body.style.overflow='hidden';}
  function closePanel(){panel.classList.remove('open');burger.setAttribute('aria-expanded','false');document.body.style.overflow='';}
  burger.addEventListener('click',openPanel);
  closeBtn.addEventListener('click',closePanel);
  panel.querySelectorAll('a').forEach(function(a){a.addEventListener('click',closePanel);});
})();
</script>
